services:
  - type: web
    name: eps-villavicencio
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eps-villavicencio-db
          property: connectionString
      - key: DB_USER
        value: eps_app
      - key: DB_PASSWORD
        generateValue: true
      - key: DB_ADMIN_USER
        value: eps_admin
      - key: DB_ADMIN_PASSWORD
        generateValue: true
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: eps-villavicencio-db
    plan: free
    region: oregon
    databaseName: eps_villavicencio
    user: eps_owner
